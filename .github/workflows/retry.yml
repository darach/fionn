name: Retry Failed CI

# Automatically retry failed CI runs to handle transient infrastructure failures
# (e.g., Windows runner 'Could not find path D:\a' errors).
# Retries only the failed jobs, up to 2 retries (3 total attempts).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed jobs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            console.log(`Retrying run ${context.payload.workflow_run.id} (attempt ${context.payload.workflow_run.run_attempt + 1}/3)`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
