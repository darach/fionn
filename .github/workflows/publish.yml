name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: fionn-linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: fionn-linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: fionn-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: fionn-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: fionn-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: fionn-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin fionn
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.name }}.tar.gz fionn
          cd ../../..
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path fionn.exe -DestinationPath ../../../${{ matrix.name }}.zip
          cd ../../..
          (Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ASCII ${{ matrix.name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  collect-hashes:
    name: Collect Hashes
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts

      - name: Collect hashes
        id: hash
        run: |
          cd artifacts
          find . -name "*.sha256" -exec cat {} \; > ../all-hashes.txt
          cd ..
          cat all-hashes.txt
          HASHES=$(cat all-hashes.txt | base64 -w0)
          echo "hashes=$HASHES" >> $GITHUB_OUTPUT

  release:
    name: GitHub Release
    needs: [build, collect-hashes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec mv {} release/ \;
          ls -la release/

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md 2>/dev/null || echo "- Initial release" >> CHANGELOG.md

      - name: Delete stale release (idempotent retry)
        run: gh release delete "${{ steps.changelog.outputs.tag }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          files: release/*
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign:
    name: Sign Release Artifacts
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v3.10.1

      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts

      - name: Sign each artifact
        run: |
          mkdir -p signatures
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read -r file; do
            filename=$(basename "$file")
            echo "Signing $filename..."
            cosign sign-blob --yes "$file" \
              --output-signature "signatures/${filename}.sig" \
              --output-certificate "signatures/${filename}.pem"
          done
          ls -la signatures/

      - name: Upload signatures to release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          files: signatures/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Publish crates
        run: |
          set -euo pipefail

          CRATES=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for pkg in data['packages']:
              if pkg.get('publish') is not None:
                  continue
              has_dep = False
              for dep in pkg['dependencies']:
                  if dep.get('path') and dep.get('kind') is None:
                      has_dep = True
                      print(dep['name'] + ' ' + pkg['name'])
              if not has_dep:
                  print(pkg['name'] + ' ' + pkg['name'])
          " | tsort)

          echo "Publishing crates in order:"
          echo "$CRATES"

          publish_crate() {
            local crate=$1
            local max_retries=3
            local attempt=1

            while [ $attempt -le $max_retries ]; do
              echo "::group::Publishing $crate (attempt $attempt/$max_retries)"
              if cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"; then
                echo "::endgroup::"
                echo "Published $crate successfully"
                sleep 30
                return 0
              fi
              echo "::endgroup::"

              if [ $attempt -lt $max_retries ]; then
                echo "Retrying $crate in 30s..."
                sleep 30
              fi
              attempt=$((attempt + 1))
            done

            echo "::error::Failed to publish $crate after $max_retries attempts"
            return 1
          }

          for crate in $CRATES; do
            publish_crate "$crate"
          done

          echo "All crates published successfully"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  provenance:
    name: Generate SLSA Provenance
    needs: [collect-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.collect-hashes.outputs.hashes }}"
      upload-assets: true

  pypi:
    name: Publish to PyPI
    needs: [release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pypi.yml
    secrets: inherit
